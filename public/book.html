<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<meta name="description" content="Choose a service and a time, then secure it with a deposit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css?v=20261121b">
</head>
<body class="app">
<header class="top"><div class="wrap narrow"><div class="brand-id"><img id="logo" class="hide" alt="" width="44" height="44" src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22/%3E"><h1 id="salon-name">Book an appointment</h1></div></div></header>
<main class="wrap narrow book-main">
  <div id="loading" class="muted">Loading…</div>
  <div id="notfound" class="hide"><h2 id="notfound-title">Salon not found</h2><p class="muted" id="notfound-msg">Please check the link you were given.</p></div>

  <!-- BOOKING FLOW -->
  <div id="flow" class="hide">
    <aside class="flow-side">
      <p class="muted" id="salon-info"></p>
      <p class="muted hide" id="closed-days"></p>
      <div class="steps"><span class="on" id="st1">1 Service</span><span id="st2">2 Time</span><span id="st3">3 Your details</span></div>
    </aside>

    <div class="flow-main">
    <section class="step" id="step-service">
      <h2>Choose a service</h2>
      <div id="svc-list" class="svc-list"></div>
    </section>

    <section class="step hide" id="step-time">
      <h2>Pick a day and time</h2>
      <label for="date">Date</label>
      <input id="date" type="date">
      <div id="slots" class="chips"></div>
      <div class="muted" id="slot-msg"></div>
    </section>

    <form class="step hide" id="step-details">
      <h2>Your details</h2>
      <div class="muted" id="summary"></div>
      <label for="c-name">Full name</label><input id="c-name" autocomplete="name" required maxlength="80">
      <label for="c-phone">Phone / WhatsApp</label><input id="c-phone" type="tel" autocomplete="tel" required maxlength="30">
      <label for="c-email">Email <span class="muted" id="email-hint">(optional)</span></label><input id="c-email" type="email" autocomplete="email" maxlength="120">
      <label for="c-notes">Anything we should know? <span class="muted">(optional)</span></label><textarea id="c-notes" rows="2" maxlength="300"></textarea>
      <div class="err" id="err-book" role="alert"></div>
      <button type="submit" id="book-btn">Continue to payment</button>
    </form>
    </div>
  </div>

  <!-- PAYMENT / STATUS -->
  <div id="status" class="hide"></div>
  <p class="muted legal-links"><a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of service</a></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => 'GYD ' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
const slug = decodeURIComponent(location.pathname.split('/')[2] || '');
const API = `/api/public/${encodeURIComponent(slug)}`;
let SALON, SERVICES = [], today, sel = { service: null, date: '', time: '' };

const fmtTime = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

async function call(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function setStep(n) {
  [1, 2, 3].forEach((i) => $('st' + i).classList.toggle('on', i <= n));
  $('step-time').classList.toggle('hide', n < 2);
  $('step-details').classList.toggle('hide', n < 3);
}

// ---------- branding ----------
function applyBrand(s) {
  let [r, g, b] = [1, 3, 5].map((i) => parseInt((s.brandColor || '#6b2d57').slice(i, i + 2), 16));
  // Header text is white, so darken pale colours until they stay readable.
  for (let n = 0; n < 30 && (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5; n++) { r *= 0.92; g *= 0.92; b *= 0.92; }
  const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
  const root = document.documentElement.style;
  root.setProperty('--brand', hex(r, g, b)); root.setProperty('--brand-dark', hex(r * 0.75, g * 0.75, b * 0.75));
  if (s.logo) { $('logo').src = s.logo; $('logo').classList.remove('hide'); }
}

// ---------- booking flow ----------
function renderServices() {
  $('svc-list').innerHTML = SERVICES.length ? SERVICES.map((s) => `
    <button type="button" class="svc ${sel.service?.id === s.id ? 'on' : ''}" data-id="${s.id}">
      <span>${esc(s.name)}<small>${s.duration_min} min</small></span>
      <span class="svc-price"><b>${money(s.price)}</b><small>deposit ${money(s.deposit)}</small></span>
    </button>`).join('') : '<p class="muted">This salon has not added any services yet.</p>';
}
$('svc-list').onclick = (e) => {
  const b = e.target.closest('.svc'); if (!b) return;
  sel.service = SERVICES.find((s) => s.id === Number(b.dataset.id)); sel.time = '';
  renderServices(); setStep(2); loadSlots();
  $('step-time').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
$('date').onchange = () => { sel.date = $('date').value; sel.time = ''; setStep(2); loadSlots(); };

async function loadSlots() {
  if (!sel.service || !sel.date) { $('slots').innerHTML = ''; $('slot-msg').textContent = 'Choose a date to see available times.'; return; }
  $('slots').innerHTML = ''; $('slot-msg').textContent = 'Checking availability…';
  try {
    const { slots, closed } = await call('GET', `${API}/slots?service=${sel.service.id}&date=${sel.date}`);
    $('slot-msg').textContent = closed ? `The salon is closed that day${closed.note ? ` (${closed.note})` : ''}. Please pick another date.`
      : slots.length ? '' : 'No times available that day. Please try another date.';
    $('slots').innerHTML = slots.map((t) => `<button type="button" class="chip ${sel.time === t ? 'on' : ''}" data-t="${t}">${fmtTime(t)}</button>`).join('');
  } catch (x) { $('slot-msg').textContent = x.message; }
}
$('slots').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  sel.time = b.dataset.t;
  $('slots').querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
  $('summary').innerHTML = `<b>${esc(sel.service.name)}</b><br>${esc(fmtDate(sel.date))} at ${fmtTime(sel.time)}<br>Deposit to secure: <b>${money(sel.service.deposit)}</b>${SALON.cash ? ' (or pay cash at the salon)' : ''}`;
  setStep(3);
  $('step-details').scrollIntoView({ behavior: 'smooth', block: 'start' });
};

$('step-details').onsubmit = async (e) => {
  e.preventDefault(); $('err-book').textContent = ''; $('book-btn').disabled = true;
  try {
    const r = await call('POST', `${API}/book`, {
      serviceId: sel.service.id, date: sel.date, time: sel.time,
      name: $('c-name').value, phone: $('c-phone').value, email: $('c-email').value, notes: $('c-notes').value,
    });
    history.replaceState(null, '', `${location.pathname}?code=${r.code}&t=${encodeURIComponent(r.token)}`);
    showStatus(r.code);
  } catch (x) {
    $('err-book').textContent = x.message; $('book-btn').disabled = false;
    if (/just taken/i.test(x.message)) { sel.time = ''; setStep(2); loadSlots(); }
  }
};

// ---------- payment + status ----------
let poll;
async function showStatus(code) {
  $('flow').classList.add('hide'); $('status').classList.remove('hide'); clearTimeout(poll);
  let d;
  try { d = await call('GET', `${API}/appointments/${encodeURIComponent(code)}?t=${encodeURIComponent(manageT())}`); }
  catch (x) { $('status').innerHTML = `<div class="card"><h2>Booking not found</h2><p class="muted">${esc(x.message)}</p><a href="${location.pathname}">Start a new booking</a></div>`; return; }
  const a = d.appointment, s = d.salon, m = s.mmg, pp = s.paypal;
  const when = `${esc(fmtDate(a.start.slice(0, 10)))} at ${fmtTime(a.start.slice(11))}`;
  const head = `<div class="card ticket"><h2>${esc(a.service)}</h2><div>${when}</div><div class="muted">Booking code <span class="code">${esc(a.code)}</span></div></div>`;
  let body = '';

  // Coming back from MMG (?mmg=…) or PayPal (?paypal=…).
  const q = new URLSearchParams(location.search);
  const gw = q.get('paypal') ? 'PayPal' : 'MMG', flag = q.get('paypal') || q.get('mmg');
  const flagMsg = {
    cancelled: `${gw} payment was cancelled. You can try again or choose another way to pay below.`,
    failed: `${gw} could not complete the payment. You can try again or choose another way to pay below.`,
    error: `We couldn’t confirm the ${gw} payment. If money left your account, contact the salon with your booking code.`,
  }[flag];
  const notice = flagMsg && a.status === 'pending_payment' ? `<p class="notice" role="status">${flagMsg}</p>` : '';
  const usd = a.depositUsd ? `USD ${a.depositUsd}` : '';

  // A manual payment the client reports with a transaction ID (MMG transfer or PayPal.me).
  const reportForm = (method, label) => `<form class="pay-form" data-method="${method}">
      <label for="ref-${method}">After paying, enter the ${label} transaction ID from your receipt</label>
      <input id="ref-${method}" class="ref" required minlength="4" maxlength="60" autocomplete="off">
      <div class="err" role="alert"></div>
      <button type="submit" class="ghost">I’ve paid</button>
    </form>`;

  if (a.status === 'pending_payment') {
    const online = [
      m.checkout ? `<button type="button" data-checkout="mmg">Pay with MMG</button>` : '',
      pp.checkout && usd ? `<button type="button" data-checkout="paypal">Pay with PayPal (${usd})</button>` : '',
    ].filter(Boolean).join(' ');
    const manual = [
      m.number ? `<details ${online ? '' : 'open'}><summary>Send by MMG${m.checkout ? ' manually' : ''}</summary>
        <div class="pay">
          <div>MMG number: <b>${esc(m.number)}</b></div>
          ${m.name ? `<div>Account name: <b>${esc(m.name)}</b></div>` : ''}
          <div>Add this as the note/reference: <span class="code">${esc(a.code)}</span></div>
        </div>${reportForm('mmg', 'MMG')}</details>` : '',
      pp.me && usd ? `<details><summary>Send by PayPal.me (${usd})</summary>
        <div class="pay">
          <div><a class="btn ghost small" href="https://paypal.me/${encodeURIComponent(pp.me)}/${a.depositUsd}USD" target="_blank" rel="noopener">Open paypal.me/${esc(pp.me)}</a></div>
          <div>Add this as the note: <span class="code">${esc(a.code)}</span></div>
        </div>${reportForm('paypal_me', 'PayPal')}</details>` : '',
    ].filter(Boolean).join('');
    const none = !online && !manual && !s.cash;
    if (s.cash && !online && !manual) {
      // Cash is the only option: no deposit to show, just confirm.
      body = `<div class="card"><h2>Confirm your booking</h2>
        <p>Your time is held for <b>${s.holdMinutes} minutes</b>. You pay <b>${money(a.price)}</b> in cash at the salon; the salon confirms your booking.</p>
        <div class="err" id="err-cash" role="alert"></div><button type="button" id="cash-btn">Book and pay at the salon</button></div>`;
    } else body = `<div class="card"><h2>Pay your deposit to secure it</h2>${notice}
      <p>Your time is held for <b>${s.holdMinutes} minutes</b> from booking.</p>
      <div class="pay"><div class="big">${money(a.deposit)}</div>
        ${usd && (pp.checkout || pp.me) ? `<div class="muted">${usd} if you pay by PayPal</div>` : ''}
        ${online ? '<div>Pay online and your booking confirms automatically.</div>' : ''}</div>
      ${online ? `<div class="err" id="err-checkout" role="alert"></div><div class="pay-buttons">${online}</div>` : ''}
      ${manual}
      ${s.cash ? `<div class="pay-cash"><p class="muted">Prefer cash? Pay the full ${money(a.price)} at the salon. No deposit now; the salon confirms your booking.</p>
        <div class="err" id="err-cash" role="alert"></div><button type="button" class="ghost" id="cash-btn">Pay cash at the salon</button></div>` : ''}
      ${none ? `<p>Please contact the salon to arrange your deposit${s.phone ? `: <b>${esc(s.phone)}</b>` : ''}.</p>` : ''}
      ${a.deposit < a.price ? `<p class="muted">Balance of ${money(a.price - a.deposit)} is paid at the salon.</p>` : ''}</div>`;
  } else if (a.status === 'payment_submitted' && flag === 'paid') {
    body = `<div class="card"><h2>Payment received</h2>
      <p>${gw} confirmed your deposit, but your hold had run out and the time may no longer be free. The salon has been told and will contact you. Your booking code is <b>${esc(a.code)}</b>.</p></div>`;
  } else if (a.status === 'payment_submitted' && a.payMethod === 'cash') {
    body = `<div class="card"><h2>Booked: pay at the salon</h2>
      <p>You’ll pay ${money(a.price)} in cash at your appointment. The salon will confirm your booking; this page updates automatically. Keep your code <b>${esc(a.code)}</b>.</p></div>`;
  } else if (a.status === 'payment_submitted') {
    body = `<div class="card"><h2>Thanks, payment reported</h2>
      ${flag === 'pending' ? '<p>PayPal is still processing your payment.</p>' : ''}
      <p>The salon will check the deposit and confirm your appointment. Keep this page or your code <b>${esc(a.code)}</b>; this page updates automatically.</p></div>`;
  } else if (a.status === 'confirmed') {
    body = `<div class="card"><h2 class="ok-msg">You’re booked!</h2>
      <p>See you ${when}.</p>
      ${d.salon.address ? `<p class="muted">${esc(d.salon.address)}</p>` : ''}
      ${d.salon.phone ? `<p class="muted">Need to change something? Contact the salon: ${esc(d.salon.phone)}</p>` : ''}</div>`;
  } else {
    const byClient = a.status === 'cancelled' && a.cancelledBy === 'client';
    body = `<div class="card"><h2>${a.status === 'expired' ? 'This booking expired' : byClient ? 'You cancelled this booking' : 'This booking was cancelled'}</h2>
      <p class="muted">${a.status === 'expired' ? 'The deposit was not reported in time, so the slot was released.'
        : byClient ? 'Your time has been released. If you paid a deposit, please contact the salon about it.' : 'If this is unexpected, please contact the salon.'}</p>
      <a class="btn" href="${location.pathname}">Book again</a></div>`;
  }
  $('status').innerHTML = head + body + manageCard(d);

  const base = `${API}/appointments/${encodeURIComponent(code)}`;
  $('status').querySelectorAll('[data-checkout]').forEach((btn) => btn.onclick = async () => {
    const label = btn.textContent, gwName = btn.dataset.checkout === 'paypal' ? 'PayPal' : 'MMG';
    $('err-checkout').textContent = ''; btn.disabled = true; btn.textContent = `Opening ${gwName}…`;
    try { const r = await call('POST', `${base}/${btn.dataset.checkout}-checkout`); location.href = r.url; }
    catch (x) { $('err-checkout').textContent = x.message; btn.disabled = false; btn.textContent = label; }
  });
  $('status').querySelectorAll('.pay-form').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault(); const err = f.querySelector('.err'); err.textContent = '';
    try { await call('POST', `${base}/payment`, { method: f.dataset.method, reference: f.querySelector('.ref').value }); showStatus(code); }
    catch (x) { err.textContent = x.message; }
  });
  const cb = $('cash-btn');
  if (cb) cb.onclick = async () => {
    if (!confirm(`Book without a deposit and pay ${money(a.price)} in cash at the salon?`)) return;
    $('err-cash').textContent = ''; cb.disabled = true;
    try { await call('POST', `${base}/cash`); showStatus(code); }
    catch (x) { $('err-cash').textContent = x.message; cb.disabled = false; }
  };
  wireManage(d, code);
  // Refresh status every 20s (skipped while the client is typing, has a payment section open, or is choosing a new time).
  if (['pending_payment', 'payment_submitted'].includes(a.status)) {
    const busy = () => document.activeElement?.matches('input') || $('move-panel')?.classList.contains('hide') === false
      || (a.status === 'pending_payment' && $('status').querySelector('.card details[open]'));
    const tick = () => { if (busy()) poll = setTimeout(tick, 20000); else showStatus(code); };
    poll = setTimeout(tick, 20000);
  }
}

// ---------- client changes (cancel / move) ----------
const manageT = () => new URLSearchParams(location.search).get('t') || '';
function manageCard(d) {
  const a = d.appointment, mg = d.manage;
  if (!['pending_payment', 'payment_submitted', 'confirmed'].includes(a.status)) return '';
  if (!mg.canCancel && !mg.canReschedule) return mg.message ? `<div class="card"><p class="muted">${esc(mg.message)}</p></div>` : '';
  const rule = mg.cutoffHours ? `You can change or cancel online up to ${mg.cutoffHours} hours before your appointment.` : 'You can change or cancel online any time before your appointment.';
  const policy = `<p class="muted">${rule}${mg.policy ? ` ${esc(mg.policy)}` : ''}</p>`;
  if (!mg.verified) {
    return `<div class="card"><h2>Change or cancel</h2>${policy}
      <form id="verify-form"><label for="last4">To continue, enter the last 4 digits of the phone number you booked with</label>
        <input id="last4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off">
        <div class="err" id="err-verify" role="alert"></div><button type="submit" class="ghost">Continue</button></form></div>`;
  }
  return `<div class="card"><h2>Change or cancel</h2>${policy}
    ${mg.canReschedule ? '' : `<p class="muted">${esc(mg.message)}</p>`}
    <div class="pay-buttons">
      ${mg.canReschedule ? '<button type="button" class="ghost" id="move-btn">Move to another time</button>' : ''}
      ${mg.canCancel ? '<button type="button" class="danger" id="cancel-btn">Cancel booking</button>' : ''}
    </div>
    <div class="err" id="err-manage" role="alert"></div>
    <div id="move-panel" class="hide">
      <label for="move-date">New date</label><input id="move-date" type="date" min="${esc(today)}">
      <div id="move-slots" class="chips"></div><div class="muted" id="move-msg">Choose a date to see free times.</div>
    </div></div>`;
}
function wireManage(d, code) {
  const a = d.appointment, base = `${API}/appointments/${encodeURIComponent(code)}`;
  const vf = $('verify-form');
  if (vf) vf.onsubmit = async (e) => {
    e.preventDefault(); $('err-verify').textContent = '';
    try {
      const r = await call('POST', `${base}/manage-token`, { phoneLast4: $('last4').value });
      history.replaceState(null, '', `${location.pathname}?code=${encodeURIComponent(code)}&t=${encodeURIComponent(r.token)}`);
      showStatus(code);
    } catch (x) { $('err-verify').textContent = x.message; }
  };
  const cb = $('cancel-btn');
  if (cb) cb.onclick = async () => {
    const paid = a.status !== 'pending_payment' && a.payMethod !== 'cash';
    if (!confirm(`Cancel your ${a.service} appointment?${paid ? ' Deposits aren’t refunded automatically; the salon will decide about yours.' : ''}`)) return;
    cb.disabled = true; $('err-manage').textContent = '';
    try { await call('POST', `${base}/cancel`, { t: manageT() }); showStatus(code); }
    catch (x) { $('err-manage').textContent = x.message; cb.disabled = false; }
  };
  const mb = $('move-btn');
  if (mb) mb.onclick = () => { $('move-panel').classList.toggle('hide'); $('move-date').focus(); };
  const md = $('move-date');
  if (md) md.onchange = async () => {
    $('move-slots').innerHTML = ''; $('move-msg').textContent = 'Checking availability…';
    try {
      const r = await call('GET', `${base}/slots?date=${md.value}&t=${encodeURIComponent(manageT())}`);
      $('move-msg').textContent = r.closed ? `The salon is closed that day${r.closed.note ? ` (${r.closed.note})` : ''}.`
        : r.slots.length ? 'Tap a time to move your appointment there.' : 'No free times that day. Please try another date.';
      $('move-slots').innerHTML = r.slots.map((t) => `<button type="button" class="chip" data-t="${t}">${fmtTime(t)}</button>`).join('');
    } catch (x) { $('move-msg').textContent = x.message; }
  };
  const ms = $('move-slots');
  if (ms) ms.onclick = async (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (!confirm(`Move your appointment to ${fmtDate(md.value)} at ${fmtTime(b.dataset.t)}?`)) return;
    $('err-manage').textContent = ''; b.disabled = true;
    try { await call('POST', `${base}/reschedule`, { t: manageT(), date: md.value, time: b.dataset.t }); showStatus(code); }
    catch (x) { $('err-manage').textContent = x.message; b.disabled = false; if (/taken/i.test(x.message)) md.onchange(); }
  };
}

// ---------- boot ----------
(async () => {
  try {
    const d = await call('GET', API);
    SALON = d.salon; SERVICES = d.services; today = d.today;
    document.title = `Book at ${SALON.name}`;
    applyBrand(SALON);
    $('salon-name').textContent = SALON.name;
    $('salon-info').textContent = [SALON.address, SALON.phone].filter(Boolean).join('\n');
    const shortDay = (s) => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    if (d.closures?.length) {
      $('closed-days').innerHTML = '<b>Closed</b>' + d.closures.slice(0, 6).map((c) =>
        `<br>${esc(shortDay(c.start))}${c.end !== c.start ? ` to ${esc(shortDay(c.end))}` : ''}${c.note ? ` · ${esc(c.note)}` : ''}`).join('');
      $('closed-days').classList.remove('hide');
    }
    if (SALON.clientEmails) $('email-hint').textContent = `(optional: we’ll email your confirmation${SALON.reminderHours ? ' and a reminder' : ''})`;
    $('date').min = today;
    $('loading').classList.add('hide');
    const code = new URLSearchParams(location.search).get('code');
    if (code) return showStatus(code);
    $('flow').classList.remove('hide'); renderServices();
  } catch (x) {
    $('loading').classList.add('hide'); $('notfound').classList.remove('hide');
    if (!/not found/i.test(x.message)) { $('notfound-title').textContent = 'Booking unavailable'; $('notfound-msg').textContent = x.message; }
  }
})();
</script>
</body>
</html>
